# Rules added on top of Robbes et al.'s patterns.
# Each entry needs: id, level, pattern (Python regex), agent, note.
# level is one of: author, message, pr_branch, pr_label, pr_body, file, bot

- id: local_msg_assisted_by
  level: message
  pattern: '(?im)^\s*Assisted-by:\s*.+$'
  agent: from_trailer
  note: Brief asks for Assisted-by lines. Agent name is read from the trailer text.

- id: local_msg_generated_with_claude
  level: message
  pattern: '(?i)generated with \[?Claude Code'
  agent: Claude Code
  note: Default Claude Code commit footer.

- id: local_body_generated_with_claude
  level: pr_body
  pattern: '(?i)generated with \[?Claude Code'
  agent: Claude Code
  note: Default Claude Code PR footer.

- id: local_body_codex_task
  level: pr_body
  pattern: 'https://chatgpt\.com/codex/tasks'
  agent: Codex
  note: Same rule as Robbes is_ai_pr_body() in heuristics.py.

- id: local_branch_claude
  level: pr_branch
  pattern: '^claude/'
  agent: Claude Code
  note: Listed in the brief; not in Robbes branches.csv at the pinned commit.

- id: local_body_made_with_cursor
  level: pr_body
  pattern: 'Made with \[Cursor\]'
  agent: Cursor
  note: Default Cursor PR footer (seen in biopython#5247).

# Added 2026-11-03 after the Bioconductor manual check of unflagged AI mentions
# (notes/bioc_missed.csv, kind A). Fixed formats written by tools; applied to all communities.
- id: local_author_antigravity
  level: author
  pattern: '^Antigravity <gemini@google\.com>$'
  agent: Antigravity
  note: Google Antigravity co-author trailer (doppelgangR). Listed before the generic Gemini rule.

- id: local_author_gemini_google
  level: author
  pattern: '^(?!Gemini Code Assist )[^<]*<gemini(?:-assistant)?@google\.com>$'
  agent: Gemini
  note: Gemini co-author trailer, e.g. "Gemini 3.5 Flash <gemini@google.com>" (AnVILGCP, BiocPkgTools). Gemini Code Assist excluded; a manual check labelled it review suggestions (kind C, lefser).

- id: local_msg_made_with_cursor
  level: message
  pattern: '(?im)^\s*Made-with:\s*Cursor\b'
  agent: Cursor
  note: Cursor commit trailer (SpiecEasi, maaslin3, tidySummarizedExperiment).

- id: local_msg_copilot_workspace
  level: message
  pattern: 'copilot-workspace\.githubnext\.com'
  agent: Copilot Workspace
  note: Link to a Copilot Workspace session in the commit message (CRISPRball, methylKit).

- id: local_msg_merge_copilot_branch
  level: message
  pattern: '\AMerge pull request #\d+ from [^\s/]+/copilot/'
  agent: Copilot
  note: Merge of a Copilot coding-agent branch, kept by git as a single-parent commit (HiCcompare, SpectralTAD, TADCompare).

- id: local_msg_generated_by_agent
  level: message
  pattern: '(?i)\bGenerated by (?P<agent>Claude|Codex|Cursor|GitHub Copilot|GPT|OpenCode|Antigravity|Grok|Gemini)\b'
  agent: from_match
  note: Added 2026-11-03 after the nf-core manual check (notes/nfcore_missed.csv, nfcore_missed_extra.csv, kind A). Plain "Generated by <tool>" line, often per squashed sub-commit (scdownstream, modules, sarek, demultiplex). Agent name read from the match. No hits in Bioconductor or Biopython at the time of adding; applied to all communities. 2026-11-04 (manual decision, after the nf-core dev recall check, notes/nfcore_dev_missed.csv) - line-start anchor dropped so the phrase also matches mid-sentence; adds exactly 3 commits (epitopeprediction "... Generated by Codex"), no other new matches in any community. "Coding/Writing assisted with <model>" lines (80 commits, one author) are deliberately not a rule; reported as known misses.

# Bots that are not AI agents. Excluded from the denominator.
- id: local_bot_nfcore
  level: bot
  pattern: 'nf-core-bot'
  agent: nf-core-bot
  note: Account nf-core-bot <core@nf-co.re> (nf-core template sync and linting bot). Checked 2026-11-11 in data/commits.parquet - 5,709 commits authored by it, 259 with it as co-author; the co-authored ones were checked by hand (notes/nfcore_botcheck.csv) and kept them as bots.
